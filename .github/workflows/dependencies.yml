name: Dependencies

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/dependencies.yml
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/dependencies.yml
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Advisories, licenses, bans, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
